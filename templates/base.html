<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ShopNest{% endblock %}</title>

  <!-- Urbanist from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Urbanist', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'Urbanist', sans-serif; }
    input:focus { outline: none; }
  </style>
</head>
<body class="bg-white text-black min-h-screen pt-20">

  <!-- Navbar (only shown when authenticated) -->
  {% if user.is_authenticated %}
  <nav class="fixed top-0 left-0 right-0 z-50 border-b border-gray-200 bg-white/80 backdrop-blur-md px-6 py-4 flex items-center justify-between">
    <span class="text-sm font-semibold tracking-widest uppercase text-gray-400">ShopNest</span>
    <div class="flex items-center gap-6">
      <span class="text-sm text-gray-500">{{ user.username }}</span>
      <a href="{% url 'accounts:logout' %}"
         class="text-sm text-gray-400 hover:text-black transition-colors duration-200">
        Sign out
      </a>
    </div>
  </nav>
  {% endif %}

  <!-- Messages -->
  {% if messages %}
  <div class="px-6 pt-4">
    {% for message in messages %}
    <div class="mb-2 px-4 py-3 text-sm rounded border
      {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-700
      {% else %}bg-gray-50 border-gray-200 text-gray-700{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Main Content -->
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
